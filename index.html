<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Simulador do RPM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Tela de login da página pública. A página inteira está cifrada (AES-GCM, chave por PBKDF2 de
   login + senha) no bloco CIFRA; quem acerta descriptografa no próprio navegador e a página é
   escrita por cima desta. Mesmos tokens do simulador. */
:root {
  --bg: #f4f6f7; --surface: #ffffff; --ink: #0f1b24; --muted: #6b7781; --faint: #a7b0b7; --line: #e2e7ea;
  --sim: #005471; --ant: #9a004f; --muted: #5f6b73;
  --shadow: 0 1px 2px rgba(15, 27, 36, .18), 0 2px 8px rgba(15, 27, 36, .10);
  --ui: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0c1217; --surface: #121a20; --ink: #e7edf1; --muted: #8b97a1; --faint: #56636d; --line: #223039;
    --sim: #3f97b9; --ant: #d2508f; --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 2px 8px rgba(0, 0, 0, .35); color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0c1217; --surface: #121a20; --ink: #e7edf1; --muted: #8b97a1; --faint: #56636d; --line: #223039;
  --sim: #3f97b9; --ant: #d2508f; --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 2px 8px rgba(0, 0, 0, .35); color-scheme: dark; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 13px; -webkit-font-smoothing: antialiased;
  display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
.caixa { width: min(100%, 360px); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 26px 26px 22px; }
.marca { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
.marca b { color: var(--ink); font-weight: 700; }
h1 { margin: 0 0 18px; font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 10px 0 4px; }
input { width: 100%; box-sizing: border-box; font: 500 13px var(--num); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; }
input:focus-visible { outline: 2px solid var(--sim); outline-offset: 1px; }
.linha { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; }
.lembrar { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.lembrar input { width: auto; margin: 0; }
button { font: 600 13px var(--ui); color: var(--bg); background: var(--sim); border: 0; border-radius: 999px; padding: 8px 18px; cursor: pointer; }
button:disabled { opacity: .55; cursor: wait; }
.erro { min-height: 16px; margin-top: 10px; font-size: 12px; color: var(--ant); }
.nota { margin-top: 14px; font-size: 12px; color: var(--muted); line-height: 1.45; }
</style>
</head>
<body>
<form class="caixa" id="f" autocomplete="on">
  <div class="marca"><b>Simulador do RPM</b> · acesso restrito</div>
  <h1>Entrar</h1>
  <label for="u">Login</label>
  <input id="u" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required>
  <label for="p">Senha</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <div class="linha"><label class="lembrar"><input type="checkbox" id="lembrar"> lembrar neste navegador</label><button type="submit" id="b">Entrar</button></div>
  <div class="erro" id="e" role="alert"></div>
  <p class="nota">A página é descriptografada no seu navegador; nada é enviado a servidor algum. "Lembrar" guarda a chave só neste navegador. Sem JavaScript não há como entrar.</p>
</form>

(async function () {
  const $ = id => document.getElementById(id), enc = new TextEncoder(), dec = new TextDecoder();
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const CHAVE = "simrpm-chave";
  async function derivar(login, senha) {
    const base = await crypto.subtle.importKey("raw", enc.encode(login.trim().toLowerCase() + "\n" + senha), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(CIFRA.salt), iterations: CIFRA.it, hash: "SHA-256" }, base,
                                   { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }
  async function abrir(chave) {
    const texto = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(CIFRA.iv) }, chave, b64(CIFRA.dados));
    const html = dec.decode(texto);
    document.open(); document.write(html); document.close();
  }
  async function lembrada() {
    try { const raw = localStorage.getItem(CHAVE); if (!raw) return false;
      const chave = await crypto.subtle.importKey("raw", b64(raw), { name: "AES-GCM" }, true, ["decrypt"]);
      await abrir(chave); return true; } catch (e) { try { localStorage.removeItem(CHAVE); } catch (_) {} return false; }
  }
  if (!CIFRA || !crypto.subtle) { $("e").textContent = "Este navegador não suporta a descriptografia (precisa de HTTPS e WebCrypto)."; return; }
  if (await lembrada()) return;
  $("f").addEventListener("submit", async ev => {
    ev.preventDefault(); $("b").disabled = true; $("e").textContent = "";
    try {
      const chave = await derivar($("u").value, $("p").value);
      if ($("lembrar").checked) { try { localStorage.setItem(CHAVE, btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey("raw", chave))))); } catch (_) {} }
      await abrir(chave);
    } catch (e) { $("e").textContent = "Login ou senha incorretos."; $("b").disabled = false; $("p").select(); }
  });
})();
